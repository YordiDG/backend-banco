spring.application.name=bancodemo

# Configuración del servidor
server.port=8080
#server.servlet.context-path=/api

# Configuración de la base de datos
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de H2 Console (para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuración JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.financiera=DEBUG
logging.level.com.banco.bancodemo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Configuración de JWT
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=${JWT_EXPIRATION}

# Configuración de CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:4200}
cors.allowed.methods=${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed.headers=${CORS_HEADERS:*}

# Usuario de seguridad por defecto
spring.security.user.name=${ADMIN_USER}
spring.security.user.password=${ADMIN_PASS}

# Configuración de Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
